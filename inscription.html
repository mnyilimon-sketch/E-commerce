<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - E-SHOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }
body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1400&q=80') center/cover no-repeat fixed;
            padding: 20px;
        }

        section {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            color: #fff;
        }

        .input-box input {
            background: rgba(255, 255, 255, 0.85);
        }

        .register-link,
        .register-link p,
        .back-home,
        #form-status {
            color: #fff;
        }

        .register-link a,
        .back-home:hover {
            color: #ffb199;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #222;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            height: 48px;
            padding: 0 45px 0 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s ease-in-out;
        }

        .input-box input:focus {
            border-color: #ff4d00;
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #ff4d00;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease-in-out;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #e64300;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: #666;
        }

        .register-link a {
            color: #ff4d00;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        #form-status {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #999;
            text-decoration: none;
        }

        .back-home:hover {
            color: #ff4d00;
        }
    </style>
</head>
<body>

    <section>

        <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> Retour à la connexion</a>

        <h1>Créer un compte</h1>

        <p id="form-status"></p>

        <form id="register-form">

            <div class="input-box">
                <input type="text" id="input-name" placeholder="Nom complet" required>
                <i class="bi bi-person"></i>
            </div>

            <div class="input-box">
                <input type="email" id="input-email" placeholder="Adresse e-mail" required>
                <i class="bi bi-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" id="input-password" placeholder="Mot de passe" required minlength="6">
                <i class="bi bi-lock"></i>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">S'inscrire</button>

        </form>

        <div class="register-link">
            <p>Déjà un compte ? <a href="index.html">Se connecter</a></p>
        </div>

    </section>

    <script>

        const AUTH_API_URL = 'http://localhost:5000/api/auth';

        const form = document.getElementById('register-form');
        const statusEl = document.getElementById('form-status');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            statusEl.style.color = 'red';
            statusEl.textContent = '';

            const name = document.getElementById('input-name').value.trim();
            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;

            submitBtn.disabled = true;

            try {
                const response = await fetch(AUTH_API_URL + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erreur lors de l inscription.');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                window.location.href = 'Shop.html';

            } catch (error) {
                statusEl.textContent = error.message || 'Une erreur est survenue.';
            } finally {
                submitBtn.disabled = false;
            }
        });

    </script>

</body>
</html>
