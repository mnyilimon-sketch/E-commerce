<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - E-SHOP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff1e8, #ffe4e4);
            padding: 20px;
        }

        section {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #222;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        .input-box input,
        .input-box select {
            width: 100%;
            height: 48px;
            padding: 0 45px 0 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s ease-in-out;
        }

        .input-box input:focus {
            border-color: #ff4d00;
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 1.1rem;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            color: #666;
            margin-bottom: 20px;
        }

        .remember-forgot a {
            color: #ff4d00;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #ff4d00;
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease-in-out;
        }

        .login-btn:hover {
            background: #e64300;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.88rem;
            color: #666;
        }

        .register-link a {
            color: #ff4d00;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        #form-status {
            text-align: center;
            font-size: 0.85rem;
            margin-bottom: 15px;
            min-height: 18px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.85rem;
            color: #999;
        }

        .back-home:hover {
            color: #ff4d00;
        }
    </style>
</head>
<body>

    <section>
<a href="accueil.html" class="back-home"><i class="bi bi-arrow-left"></i> Retour à l'accueil</a>

       <h1>Connexion</h1>

        <p id="form-status"></p>

        <form id="auth-form">

            <div class="input-box">
                <input type="email" id="input-email" placeholder="Adresse e-mail" required>
                <i class="bi bi-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" id="input-password" placeholder="Mot de passe" required>
                <i class="bi bi-lock"></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox"> Se souvenir de moi</label>
                <a href="#" id="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="login-btn" id="submit-btn">Se connecter</button>

        </form>

        <div class="register-link">
            <p>Pas de compte ? <a href="inscription.html">Inscription</a></p>
        </div>

    </section>

    <script>

        const AUTH_API_URL = 'http://localhost:5000/api/auth';

        const form = document.getElementById('auth-form');
        const statusEl = document.getElementById('form-status');
        const submitBtn = document.getElementById('submit-btn');
        const forgotLink = document.getElementById('forgot-link');

        forgotLink.addEventListener('click', async (e) => {
            e.preventDefault();

            const email = document.getElementById('input-email').value.trim();

            if (!email) {
                statusEl.style.color = 'red';
                statusEl.textContent = 'Entrez votre e-mail ci-dessus puis cliquez a nouveau sur ce lien.';
                return;
            }

            try {
                const response = await fetch(AUTH_API_URL + '/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await response.json();

                statusEl.style.color = 'green';
                statusEl.textContent = data.message || 'Si ce compte existe, un email a ete envoye.';
            } catch (error) {
                statusEl.style.color = 'red';
                statusEl.textContent = 'Impossible de contacter le serveur.';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            statusEl.style.color = 'red';
            statusEl.textContent = '';

            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;

            submitBtn.disabled = true;

            try {
                const response = await fetch(AUTH_API_URL + '/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Erreur de connexion.');
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                window.location.href = 'Shop.html';

            } catch (error) {
                statusEl.textContent = error.message || 'Une erreur est survenue.';
            } finally {
                submitBtn.disabled = false;
            }
        });

    </script>

</body>
</html>
